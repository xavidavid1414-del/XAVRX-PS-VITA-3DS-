name: Build 3DS homebrew

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-ps-vita-3ds
          path: XAVRX-PS-VITA-3DS.3dsx
