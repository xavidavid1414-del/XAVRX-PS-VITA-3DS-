name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ELF and SELF inspectors
        run: make test
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nintendo 3DS development libraries
        run: dkp-pacman -S --noconfirm 3ds-dev
      - name: Build 3DSX
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make
      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: xavrx-ps-vita-3ds
          path: build/XAVRX-PS-VITA-3DS.3dsx
